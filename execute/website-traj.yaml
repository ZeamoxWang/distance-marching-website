# Trajectory data for the interactive viewer on the project page.
# Replays the RNG of the curated DM-XL/2 ImageNet samples (CFG 4.0, 250 steps;
# sphere tracing 0.015, gradient descent 0.5), records the 250 latent states,
# runs PCA per trajectory and evaluates u_theta on a 3D grid in the PCA space.
# Finite single-GPU job (expected < 30 min after the 10.8 GB checkpoint load).
apiVersion: batch/v1
kind: Job
metadata:
  name: zimo-dm-website-traj-2
  namespace: ucsd-ravigroup
  labels:
    owner: zimo
    project: distance-marching
    run-id: zimo-dm-website-traj-2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400  # counts queue time too
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        owner: zimo
        project: distance-marching
        run-id: zimo-dm-website-traj-2
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gp-engine.usd.edu
      containers:
        - name: compute
          image: zeamoxwang/eqm-a10@sha256:4295547d158ed67d6e6aa7fdd4a7b8c5efd464428e7ac591a099fe856e84a7cd
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_ID
              value: zimo-dm-website-traj-2
            - name: HF_HOME
              value: /nvme/hf
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              nvidia-smi
              RUN=/pv/distance-marching-runs/$RUN_ID
              mkdir -p "$RUN"
              cp -r /pv/distance-marching /nvme/code
              cp -r "$RUN/site" /nvme/site
              (cd /nvme/code && git rev-parse HEAD; cat /nvme/site/COMMIT) | tee "$RUN/commit.txt"
              python3 /nvme/site/tools/make_trajectories.py \
                --ckpt /pv/EqM/results/010-EqM-XL-2-Linear-dist-None/checkpoints/0400000.pt --code /nvme/code/imagenet \
                --ref /pv/distance-marching-runs/website-ref --out "$RUN/out" 2>&1 | tee "$RUN/log.txt"
              echo "TRAJ DONE"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 40Gi
              nvidia.com/a100: 1
            limits:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 40Gi
              nvidia.com/a100: 1
          volumeMounts:
            - name: pv
              mountPath: /pv
            - name: nvme
              mountPath: /nvme
      volumes:
        - name: pv
          persistentVolumeClaim:
            claimName: zmw-vol-haosu
        - name: nvme
          emptyDir: {}
